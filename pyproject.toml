[project]
name = "nrx-jax"
version = "0.1.0"
description = "Sionna OFDM SIMO neural receiver ported to JAX/Flax"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sionna==2.2.0",
    "torch==2.15.0",
    "jax==0.12.1",
    "flax==0.12.12",
    "optax==0.2.9",
    "orbax-checkpoint==0.12.12",
    "numpy>=2.2.6",
    "matplotlib>=3.10.8",
    "pandas",
]

[project.optional-dependencies]
# Pick one on the training host. torch on Linux ships CUDA 13, so match it.
cuda = ["jax[cuda13]==0.12.1"]
tpu = ["jax[tpu]==0.12.1"]

[dependency-groups]
dev = ["pytest", "gdown"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "tpu" }]]

[tool.setuptools]
packages = ["nrx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
